<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Tạo Phép Tính Ngẫu Nhiên</title>
    <style>
        :root {
            --primary: #4cc9f0;
            --secondary: #4895ef;
            --accent: #f72585;
            --success: #4caf50;
            --bg: #f0f2f5;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: var(--secondary);
            font-size: 1.6rem;
            margin-bottom: 25px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .full-width { grid-column: span 2; }

        label {
            display: block;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #444;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        select:focus, input[type="number"]:focus {
            border-color: var(--primary);
            outline: none;
            background-color: #fff;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 5px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
            font-size: 0.95rem;
            margin-bottom: 0;
            background: #f8fbff;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .checkbox-group label:hover {
            border-color: var(--primary);
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
            transform: scale(1.2);
            cursor: pointer;
        }

        .btn-random {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #3a86ff;
            transition: all 0.2s;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .btn-random:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #3a86ff;
        }

        .btn-random:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #3a86ff;
        }

        #results {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .math-item {
            background: #f8fbff;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #e1e8f0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            animation: slideIn 0.3s ease-out;
        }

        .math-item.flashcard {
            align-items: center;
            justify-content: center;
            min-height: 200px;
            background: #fff9e6;
            border: 2px dashed #ffb703;
        }

        .math-item.flashcard .question {
            font-size: 4.5rem;
            color: #fb8500;
            text-align: center;
        }

        .question {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2d3436;
            word-break: break-all;
        }

        .answer {
            align-self: flex-end;
            background: #e3f2fd;
            color: var(--secondary);
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            border-left: 4px solid var(--accent);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.8rem;
            color: #888;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .btn-copy {
            background-color: #e0e0e0;
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background-color: #d0d0d0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧮 TOÁN TIỂU HỌC</h1>

    <div class="settings-grid">
        <div class="full-width">
            <label>Phép tính:</label>
            <select id="operator" onchange="toggleSettings()">
                <option value="plus">Cộng (+)</option>
                <option value="minus">Trừ (-)</option>
                <option value="multiply">Nhân (×)</option>
                <option value="divide_exact">Chia hết (÷)</option>
                <option value="divide_remain">Chia có dư (÷)</option>
                <option value="flashcard_multiply">Luyện Bảng Cửu Chương (Lần lượt)</option>
            </select>
        </div>

        <div id="digit1-div">
            <label>Số chữ số (Số thứ 1):</label>
            <input type="number" id="digit1" value="2" min="1" max="9">
        </div>

        <div id="digit2-div">
            <label>Số chữ số (Số thứ 2):</label>
            <input type="number" id="digit2" value="2" min="1" max="9">
        </div>

        <div id="tables-div" class="full-width" style="display: none;">
            <label>Chọn bảng cửu chương muốn luyện:</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="table_cb" value="2" checked> Bảng 2</label>
                <label><input type="checkbox" name="table_cb" value="3" checked> Bảng 3</label>
                <label><input type="checkbox" name="table_cb" value="4" checked> Bảng 4</label>
                <label><input type="checkbox" name="table_cb" value="5" checked> Bảng 5</label>
                <label><input type="checkbox" name="table_cb" value="6" checked> Bảng 6</label>
                <label><input type="checkbox" name="table_cb" value="7" checked> Bảng 7</label>
                <label><input type="checkbox" name="table_cb" value="8" checked> Bảng 8</label>
                <label><input type="checkbox" name="table_cb" value="9" checked> Bảng 9</label>
            </div>
        </div>

        <!-- MỚI: Tùy chọn các số nhân -->
        <div id="multipliers-div" class="full-width" style="display: none;">
            <label>Chọn các số nhân (tùy chỉnh):</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="mult_cb" value="1" checked> 1</label>
                <label><input type="checkbox" name="mult_cb" value="2" checked> 2</label>
                <label><input type="checkbox" name="mult_cb" value="3" checked> 3</label>
                <label><input type="checkbox" name="mult_cb" value="4" checked> 4</label>
                <label><input type="checkbox" name="mult_cb" value="5" checked> 5</label>
                <label><input type="checkbox" name="mult_cb" value="6" checked> 6</label>
                <label><input type="checkbox" name="mult_cb" value="7" checked> 7</label>
                <label><input type="checkbox" name="mult_cb" value="8" checked> 8</label>
                <label><input type="checkbox" name="mult_cb" value="9" checked> 9</label>
                <label><input type="checkbox" name="mult_cb" value="10" checked> 10</label>
            </div>
        </div>

        <div id="time-div" class="full-width" style="display: none;">
            <label>Thời gian hiển thị mỗi câu (giây):</label>
            <input type="number" id="displayTime" value="3" min="1" step="0.5">
        </div>

        <div class="full-width">
            <label>Số lượng câu hỏi:</label>
            <input type="number" id="quantity" value="1" min="1" max="50">
        </div>
    </div>

    <button class="btn-random" onclick="generateMath()">BẮT ĐẦU</button>

    <div id="results"></div>

    <footer>
        <span>Ứng dụng hỗ trợ học tập - Tối đa 9 chữ số</span>
        <button class="btn-copy" onclick="copyLink()">📋 Sao chép liên kết</button>
    </footer>
</div>

<script>
    let flashcardInterval = null;

    function toggleSettings() {
        const op = document.getElementById('operator').value;
        const digit1Div = document.getElementById('digit1-div');
        const digit2Div = document.getElementById('digit2-div');
        const timeDiv = document.getElementById('time-div');
        const tablesDiv = document.getElementById('tables-div');
        const multipliersDiv = document.getElementById('multipliers-div');

        if (op === 'flashcard_multiply') {
            digit1Div.style.display = 'none';
            digit2Div.style.display = 'none';
            timeDiv.style.display = 'block';
            tablesDiv.style.display = 'block';
            multipliersDiv.style.display = 'block';
        } else {
            digit1Div.style.display = 'block';
            digit2Div.style.display = 'block';
            timeDiv.style.display = 'none';
            tablesDiv.style.display = 'none';
            multipliersDiv.style.display = 'none';
        }
    }

    function getRandomIntByDigits(digits) {
        if (digits <= 0) return 0;
        const min = Math.pow(10, digits - 1);
        const max = Math.pow(10, digits) - 1;
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function formatNumber(num) {
        return num.toLocaleString('vi-VN');
    }

    function generateMath() {
        if (flashcardInterval) {
            clearInterval(flashcardInterval);
        }

        const op = document.getElementById('operator').value;
        const qty = parseInt(document.getElementById('quantity').value);
        const resultsDiv = document.getElementById('results');
        
        resultsDiv.innerHTML = '';

        if (op === 'flashcard_multiply') {
            startFlashcards(qty, resultsDiv);
            return;
        }

        const d1 = parseInt(document.getElementById('digit1').value);
        const d2 = parseInt(document.getElementById('digit2').value);

        for (let i = 0; i < qty; i++) {
            let num1, num2, symbol, result;

            switch(op) {
                case 'plus':
                    num1 = getRandomIntByDigits(d1);
                    num2 = getRandomIntByDigits(d2);
                    symbol = '+';
                    result = formatNumber(num1 + num2);
                    break;
                case 'minus':
                    num1 = getRandomIntByDigits(d1);
                    num2 = getRandomIntByDigits(d2);
                    if (num1 < num2) [num1, num2] = [num2, num1];
                    symbol = '-';
                    result = formatNumber(num1 - num2);
                    break;
                case 'multiply':
                    num1 = getRandomIntByDigits(d1);
                    num2 = getRandomIntByDigits(d2);
                    symbol = '×';
                    result = formatNumber(num1 * num2);
                    break;
                case 'divide_exact':
                    num2 = getRandomIntByDigits(d2);
                    let tempQ = getRandomIntByDigits(Math.max(1, d1 - d2 + 1));
                    num1 = num2 * tempQ;
                    symbol = '÷';
                    result = formatNumber(tempQ);
                    break;
                case 'divide_remain':
                    num2 = getRandomIntByDigits(d2);
                    num1 = getRandomIntByDigits(d1);
                    if (num1 < num2) num1 += num2; 
                    symbol = '÷';
                    let q = Math.floor(num1 / num2);
                    let r = num1 % num2;
                    result = `${formatNumber(q)} (dư ${formatNumber(r)})`;
                    break;
            }

            const item = document.createElement('div');
            item.className = 'math-item';
            item.innerHTML = `
                <div class="question">${formatNumber(num1)} ${symbol} ${formatNumber(num2)} = ?</div>
                <div class="answer">Đáp số: ${result}</div>
            `;
            resultsDiv.appendChild(item);
        }
    }

    // MỚI: Hàm tạo danh sách câu hỏi không trùng lặp và xáo trộn
    function generateQuestionPool(allowedTables, allowedMultipliers) {
        let pool = [];
        // Tạo tất cả các tổ hợp có thể có
        for (let t of allowedTables) {
            for (let m of allowedMultipliers) {
                pool.push({ n1: t, n2: m });
            }
        }
        
        // Thuật toán Fisher-Yates để xáo trộn mảng (trộn bài)
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        
        return pool;
    }

    function startFlashcards(qty, resultsDiv) {
        const tableCheckboxes = document.querySelectorAll('input[name="table_cb"]:checked');
        const multCheckboxes = document.querySelectorAll('input[name="mult_cb"]:checked');
        
        if (tableCheckboxes.length === 0) {
            alert('Vui lòng chọn ít nhất 1 bảng cửu chương!');
            return;
        }
        if (multCheckboxes.length === 0) {
            alert('Vui lòng chọn ít nhất 1 số để nhân!');
            return;
        }
        
        const allowedTables = Array.from(tableCheckboxes).map(cb => parseInt(cb.value));
        const allowedMultipliers = Array.from(multCheckboxes).map(cb => parseInt(cb.value));
        const timeInMs = parseFloat(document.getElementById('displayTime').value) * 1000;
        
        let currentQuestion = 0;
        
        // Tạo kho câu hỏi ban đầu
        let questionPool = generateQuestionPool(allowedTables, allowedMultipliers);

        function showNextQuestion() {
            if (currentQuestion >= qty) {
                resultsDiv.innerHTML = `
                    <div class="math-item flashcard">
                        <div class="question" style="font-size: 2rem;">🎉 Đã hoàn thành!</div>
                    </div>`;
                clearInterval(flashcardInterval);
                return;
            }

            // Nếu bốc hết kho câu hỏi trước khi đạt số lượng yêu cầu (qty)
            // thì tự động nạp lại và trộn mới (đảm bảo hết 1 vòng mới lặp lại)
            if (questionPool.length === 0) {
                questionPool = generateQuestionPool(allowedTables, allowedMultipliers);
            }

            // Bốc câu hỏi cuối cùng ra khỏi mảng
            const q = questionPool.pop();

            resultsDiv.innerHTML = `
                <div class="math-item flashcard">
                    <div class="question">${q.n1} × ${q.n2} = ?</div>
                </div>`;
            
            currentQuestion++;
        }

        showNextQuestion();
        flashcardInterval = setInterval(showNextQuestion, timeInMs);
    }

    function copyLink() {
        const link = "https://gptlohoi-del.github.io/toancap1/";
        navigator.clipboard.writeText(link).then(() => {
            alert("Đã sao chép liên kết thành công!");
        }).catch(err => {
            console.error("Không thể sao chép: ", err);
        });
    }
</script>

</body>
</html>
